apiVersion: apps/v1
kind: Deployment
metadata:
  name: chunk-location
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chunk-location
  template:
    metadata:
      labels:
        app: chunk-location
    spec:
      containers:
        - name: chunk-location
          image: chunk-location:latest
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: chunk-location-config
            - secretRef:
                name: chunk-location-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
